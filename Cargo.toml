[package]
name = "mx-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "MX Player - Monitor e player nativo de streams HLS (compatível com Windows 7)"
authors = ["Matheus Rodacki"]

[build-dependencies]
winres = "0.1"

[dependencies]
# --- AS TRAVAS DE SEGURANÇA ---
# O operador "=" proíbe atualizações automáticas que podem quebrar o build.

# Reprodução de vídeo via libmpv (binários MinGW compatíveis com Win7)
# Requer: MPV_LIB_PATH apontando para diretório com libmpv.dll.a + mpv-1.dll
# Download: https://sourceforge.net/projects/mpv-player-windows/files/libmpv/
# Verificar que binários são MinGW (msvcrt) e NÃO dependem de ucrt (Win8+)
libmpv = { version = "=2.0.1", default-features = false }

# Interface Gráfica (estável para Win7 com OpenGL — sem wgpu/DirectX 12)
eframe = { version = "=0.24.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "=0.24.1"

# Serialização
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"

# Parsing de CSV/JSON para a lista de sources
csv = "=1.3.0"

# HTTP client (rustls puro, funciona em Win7 sem schannel)
ureq = { version = "=2.9.1", default-features = false, features = ["tls", "gzip"] }

# Acesso direto ao rustls para verificador permissivo
rustls = { version = "=0.21.12", features = ["dangerous_configuration"] }

# Concorrência para health checks em background
# ATENÇÃO: tokio >= 1.15 pode não suportar Win7 em algumas builds.
# Manter nesta versão e validar no target Win7 antes de atualizar.
tokio = { version = "=1.14.0", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }

# Timestamps
chrono = { version = "=0.4.31", features = ["serde"] }

# Utilitários
anyhow = "=1.0.75"
log = "=0.4.20"
env_logger = "=0.10.1"

[dev-dependencies]
tempfile = "=3.8.1"

# --- Travas de transitivos conhecidos por quebrar com versões novas ---
idna = "=0.4.0"
url = "=2.4.1"

# Fix para Win7 — winapi com features mínimas necessárias
[target.'cfg(windows)'.dependencies]
# winuser/windef: janelas e mensagens; libloaderapi: GetModuleHandleW para filho MPV
winapi = { version = "0.3.9", features = ["winuser", "windef", "libloaderapi"] }
# raw-window-handle: obter HWND da janela egui para passar ao MPV (wid)
raw-window-handle = "=0.5.2"

[profile.release]
strip = true
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
